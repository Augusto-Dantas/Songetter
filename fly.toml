# fly.toml app configuration file generated for songetter-app on 2026-11-16T16:30:29Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'songetter-app'
primary_region = 'gru'

[build]
[[mounts]]
  source = 'library'
  destination = '/library'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
